# Copy this file to /etc/nginx/sites-available/blog.sumimi.site on Ubuntu/Debian.
# The directory must be readable by the nginx worker user.
server {
    listen 80;
    listen [::]:80;
    server_name blog.sumimi.site;

    root /var/www/blog;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}

