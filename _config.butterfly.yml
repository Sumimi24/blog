# Butterfly configuration — functional, but intentionally minimal and white.
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-box-archive
  分类: /categories/ || fas fa-folder
  标签: /tags/ || fas fa-tags
  友链: /links/ || fas fa-link
  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/Sumimi24 || GitHub || '#181717'

favicon: /favicon.ico
avatar:
  img: /img/avatar.png
  effect: false

disable_top_img: true
default_top_img: false
index_img: false
archive_img: false
tag_img: false
category_img: false
footer_img: false
background: '#ffffff'

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
  default_cover:

error_404:
  enable: true
  subtitle: 页面不存在，或已被移动。
  background: '#ffffff'

subtitle:
  enable: false

index_layout: 4
index_post_content:
  method: 2
  length: 180

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: true
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/Sumimi24
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

post_edit:
  enable: true
  url: https://github.com/Sumimi24/blog/edit/main/source/

related_post:
  enable: true
  limit: 4
  date_type: created

post_pagination: 1
readmode: true

aside:
  enable: true
  hide: false
  button: true
  mobile: false
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 保持好奇，持续记录。
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/Sumimi24
  card_announcement:
    enable: true
    content: 欢迎来到我的个人博客。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 30
    color: false
    orderby: name
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY-MM
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

darkmode:
  enable: false

rightside_scroll_percent: true
rightside_config_animation: false

copy:
  enable: true
  copyright:
    enable: true
    limit_count: 150

wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# Load MathJax only for posts that declare `mathjax: true`.
math:
  use: mathjax
  per_page: false
  hide_scrollbar: false
  mathjax:
    enableMenu: true
    tags: none

mermaid:
  enable: true
  code_write: true
  theme:
    light: default
    dark: dark
  open_in_new_tab: true
  zoom_pan: true

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: true
      hitsPerPage: 8

share:
  use: sharejs
  sharejs:
    sites: wechat,weibo,qq

comments:
  use:
  text: true
  lazyload: true
  count: false
  card_post_count: false

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text: 用 Hexo 与 Butterfly 构建

inject:
  head:
    - <link rel="stylesheet" href="/css/minimal.css">
  bottom:
